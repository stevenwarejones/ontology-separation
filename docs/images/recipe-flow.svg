<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
<title id="title">From physical recipe to checked claim</title><desc id="desc">Preparation and ordered operations produce a state. Settings and readout produce Born probabilities. The observable produces a score which a Lean proof connects to a claim.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#53677c"/></marker></defs>
<rect width="720" height="230" rx="12" fill="#f3f6fa"/>
<g fill="white" stroke="#879cb1"><rect x="20" y="30" width="190" height="65" rx="8"/><rect x="265" y="30" width="190" height="65" rx="8"/><rect x="510" y="30" width="190" height="65" rx="8"/><rect x="510" y="140" width="190" height="65" rx="8"/><rect x="265" y="140" width="190" height="65" rx="8"/><rect x="20" y="140" width="190" height="65" rx="8"/></g>
<g fill="none" stroke="#53677c" stroke-width="2" marker-end="url(#arrow)"><path d="M210 62H263"/><path d="M455 62H508"/><path d="M605 95V138"/><path d="M510 173H457"/><path d="M265 173H212"/></g>
<g font-family="system-ui,sans-serif" font-size="16" text-anchor="middle" fill="#192d40"><text x="115" y="58">Prepare a state</text><text x="115" y="80" font-size="13">product or entangled</text><text x="360" y="58">Apply ordered steps</text><text x="360" y="80" font-size="13">gates and exposure laws</text><text x="605" y="58">Choose settings</text><text x="605" y="80" font-size="13">local readout bases</text><text x="605" y="168">Born probabilities</text><text x="605" y="190" font-size="13">normalized outcomes</text><text x="360" y="168">Calculate the observable</text><text x="360" y="190" font-size="13">e.g. CHSH</text><text x="115" y="168">Export a checked claim</text><text x="115" y="190" font-size="13">value tied to a Lean proof</text></g></svg>

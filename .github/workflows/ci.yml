name: Verify
on:
  pull_request:
  schedule:
    # 03:17 New York during daylight saving; 02:17 during standard time.
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
# Superseded PR commits do not need to finish. Keep main runs independent so
# a newer push cannot cancel a verified Pages deployment in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Apply the limit to Lake, tests, reports and downstream checks alike.
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned dependencies
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lean-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
      - name: Restore project and test builds
        id: project
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            examples/downstream/.lake/build
          key: lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - uses: leanprover/lean-action@v1
        with:
          # check.sh owns the build; save its complete output only after all
          # verification and snapshot checks succeed.
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: ${{ steps.dependencies.outputs.cache-hit != 'true' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[research]"
      - run: python research/lf_hidden_local_agency.py --check
      - run: sh scripts/check.sh
      - run: git diff --exit-code -- python/ontology_separation/data/report.json docs/MATRIX.md docs/matrix.html examples docs/AXIOM_AUDIT.txt
      - name: Replay project and test declarations with the kernel
        # Replay is an extra nightly audit, not part of PR/push verification.
        # Manual runs provide an on-demand full audit with the same checks.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: lake env leanchecker --verbose OntologySeparation Tests
      - name: Save pinned dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Save verified project and test builds
        if: steps.project.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            examples/downstream/.lake/build
          key: ${{ steps.project.outputs.cache-primary-key }}
      - name: Stage verified Pages snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/build_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: _site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, python-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m compileall -q python scripts python_tests
      - run: python scripts/test.py
      - run: ontology-separation compare B01 B02

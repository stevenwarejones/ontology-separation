[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-separation"
version = "0.1.0"
description = "A Python client for a Lean-verified experimental theory comparison library"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
ontology-separation = "ontology_separation.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
ontology_separation = ["data/*.json"]
